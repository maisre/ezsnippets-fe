# Deploy the Angular frontend to the lean-EC2 stack (Option A) in the `ez`
# business account: build → S3 sync → CloudFront invalidate. The frontend is
# static in both hosting options; only the account/bucket/distribution differ
# from deploy-prod.yml (which targets the personal account).
name: Deploy ez-frontend (ez / lean-EC2)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  SENTRY_ORG: ez-snippets
  SENTRY_PROJECT: ez-frontend

# One run at a time: two overlapping runs would interleave their S3 uploads and
# could leave index.html from one build pointing at the other. Queued runs wait
# rather than cancel a deploy midway. (This workflow never touches the box; the
# group name just matches the other deploy-ez.yml files.)
concurrency:
  group: ez-box
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build for production
        run: npx ng build --configuration=production

      - name: Write prod config.json
        env:
          API_URL: https://api.ez-snippets.com
          VIEW_URL: https://view.ez-snippets.com
          # AssetsStack's CloudFront domain. Serves the snippet preview
          # images published by ez-api's upload-snippet-shots.js. Must match
          # the ASSETS_CDN_URL given to ez-api and ez-background.
          ASSETS_CDN_URL: ${{ vars.ASSETS_CDN_URL || 'https://d3czwtt2i1r7wf.cloudfront.net' }}
          PADDLE_CLIENT_TOKEN: ${{ secrets.PADDLE_CLIENT_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          # Pre-launch gate: hides public Sign Up CTAs. Defaults to true; set the
          # COMING_SOON repo variable to "false" to open sign-ups. (Can also be
          # flipped instantly by editing config.json in S3 + a CloudFront
          # invalidation, no rebuild needed.)
          COMING_SOON: ${{ vars.COMING_SOON || 'true' }}
          # Plausible analytics. Domain must match the site added in Plausible.
          # Endpoint: blank sends straight to plausible.io; set the
          # PLAUSIBLE_ENDPOINT repo variable to "/api/event" once FrontendStack's
          # CloudFront proxy behavior is deployed (fewer visits lost to blockers).
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN || 'ez-snippets.com' }}
          PLAUSIBLE_ENDPOINT: ${{ vars.PLAUSIBLE_ENDPOINT || '' }}
        run: |
          cat > dist/ez-frontend/browser/config.json <<EOF
          {
            "apiUrl": "${API_URL}",
            "viewUrl": "${VIEW_URL}",
            "assetsCdnUrl": "${ASSETS_CDN_URL}",
            "paddleClientToken": "${PADDLE_CLIENT_TOKEN}",
            "sentryDsn": "${SENTRY_DSN}",
            "sentryEnvironment": "production",
            "sentryRelease": "${SENTRY_RELEASE}",
            "comingSoon": ${COMING_SOON},
            "plausibleDomain": "${PLAUSIBLE_DOMAIN}",
            "plausibleEndpoint": "${PLAUSIBLE_ENDPOINT}"
          }
          EOF

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        # The maps are built "hidden" (no sourceMappingURL in the bundles), so
        # Sentry can only pair a bundle with its map through a debug ID. inject
        # writes one into both — and must run before upload and before the S3
        # sync, so the deployed bundles carry the same IDs as the uploaded maps.
        run: |
          npx sentry-cli releases new "${{ github.sha }}"
          npx sentry-cli sourcemaps inject dist/ez-frontend/browser
          npx sentry-cli sourcemaps upload --release="${{ github.sha }}" dist/ez-frontend/browser
          npx sentry-cli releases finalize "${{ github.sha }}"

      - name: Strip source maps from build output
        run: find dist/ez-frontend/browser -name "*.map" -delete

      - name: Configure AWS credentials (ez account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.EZ_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Three passes, in this order, so a browser never gets an index.html that
      # points at a chunk not uploaded yet:
      #   1. Hashed bundles (main-/chunk-/polyfills-/styles-<hash>, media/):
      #      the name changes whenever the content does, so cache them forever.
      #   2. Everything else from public/ (favicon, svg): short cache.
      #   3. index.html + config.json last, no-cache: browsers revalidate on
      #      every load, so a deploy or a config.json flip is seen immediately
      #      instead of after the browser's own heuristic cache expires.
      # No --delete: a tab still running the previous build lazy-loads its old
      # chunks (e.g. the editor) after this deploy, and deleting them made
      # CloudFront answer with index.html, breaking the editor until a hard
      # reload. Old chunks are small; prune ones older than a few releases by
      # hand if the bucket ever needs it.
      - name: Deploy to S3
        env:
          BUCKET: s3://${{ vars.EZ_FRONTEND_BUCKET }}
          SRC: dist/ez-frontend/browser
        run: |
          aws s3 sync "$SRC/" "$BUCKET" --exclude "*" \
            --include "main-*.js" --include "chunk-*.js" --include "polyfills-*.js" \
            --include "styles-*.css" --include "media/*" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync "$SRC/" "$BUCKET" \
            --exclude "main-*.js" --exclude "chunk-*.js" --exclude "polyfills-*.js" \
            --exclude "styles-*.css" --exclude "media/*" \
            --exclude "index.html" --exclude "config.json" \
            --cache-control "public, max-age=3600"
          aws s3 cp "$SRC/config.json" "$BUCKET/config.json" \
            --cache-control "no-cache" --content-type "application/json"
          aws s3 cp "$SRC/index.html" "$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.EZ_PROD_CLOUDFRONT_ID }} --paths "/*"
